name: sara_desktop
description: Personal desktop AI chat application.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.10.7 <4.0.0"

dependencies:
  crypto: ^3.0.8
  dart_sentencepiece_tokenizer: ^1.4.1
  desktop_drop: ^0.8.0
  emoji_picker_flutter: ^4.5.4
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_onnxruntime: ^1.9.0
  flutter_localizations:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_markdown_plus: ^1.0.12
  flutter_secure_storage: ^11.2.0
  html: ^0.15.7
  image: ^4.5.4
  http: ^1.6.0
  lucide_icons_flutter: ^4.0.3
  markdown: ^7.3.1
  media_kit: ^1.2.6
  media_kit_libs_linux: ^1.2.1
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite_common_ffi: ^2.4.5
  super_clipboard: ^0.1.7+6
  uuid: ^4.6.0
  zxing_lib: ^1.1.4
dev_dependencies:
  cross_file: ^0.3.5+5
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand.png
    - assets/flutter_logo.png
    - assets/sound/
